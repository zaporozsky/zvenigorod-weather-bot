name: MAX debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get MAX updates
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: |
          curl -sS \
            -H "Authorization: $MAX_BOT_TOKEN" \
            "https://platform-api2.max.ru/updates?limit=100" \
            | python3 -m json.tool
